<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>供应商管理系统</title>
  <script src="/static/device.js?v=2"></script>
  <link rel="stylesheet" href="/static/style.css?v=20260810s" />
</head>
<body>
  <header class="topbar">
    <h1>供应商管理系统</h1>
    <div class="topbar-user">
      <span id="currentUser" class="uname"></span>
      <span id="currentRole" class="urole" hidden></span>
      <button type="button" id="changePasswordBtn" class="logout-btn">修改密码</button>
      <button type="button" id="logoutBtn" class="logout-btn">退出</button>
    </div>
  </header>

  <main class="wrap">
    <nav id="mainTabs" class="tabs tabs-3" role="tablist">
      <button type="button" class="tab" data-tab="query" role="tab" aria-selected="false">查询</button>
      <button type="button" class="tab tab-admin" data-tab="manage" role="tab" aria-selected="false">管理</button>
      <button type="button" class="tab active" data-tab="create" role="tab" aria-selected="true">录入</button>
    </nav>

    <section id="panelCreate" class="panel tab-panel active" role="tabpanel">
      <form id="orderForm">
        <div class="choice-field">
          <span class="choice-label">店铺名</span>
          <input type="hidden" id="shopId" name="shop_id" value="" />
          <div id="shopPicker" class="chip-grid" role="listbox" aria-label="选择店铺"></div>
        </div>
        <label>
          日期
          <input type="date" id="orderDate" name="order_date" required />
        </label>
        <div class="choice-field">
          <span class="choice-label">供应商名</span>
          <input type="hidden" id="supplierId" name="supplier_id" value="" />
          <div id="supplierPicker" class="chip-grid" role="listbox" aria-label="选择供应商"></div>
        </div>
        <label>
          单日总金额
          <input type="number" id="dailyTotal" name="daily_total" placeholder="例如：1280.50" min="0.01" step="0.01" required />
        </label>
        <button type="submit" id="submitBtn">提交</button>
      </form>
      <p id="formMsg" class="msg" hidden></p>

      <div class="recent-block orders-readable">
        <div class="list-head">
          <h3>最近提交</h3>
          <span id="recentMeta" class="meta"></span>
        </div>
        <div id="recentTableWrap" class="result-table-wrap" hidden>
          <table class="result-table" id="recentTable">
            <thead>
              <tr>
                <th>订单编号</th>
                <th>店铺</th>
                <th>日期</th>
                <th>供应商</th>
                <th class="num">金额</th>
                <th class="ops">操作</th>
              </tr>
            </thead>
            <tbody id="recentList"></tbody>
          </table>
        </div>
        <p id="recentEmpty" class="empty">暂无提交记录</p>
      </div>
    </section>

    <section id="panelQuery" class="panel tab-panel" role="tabpanel" hidden>
      <h2>查询订单</h2>
      <form id="queryForm" class="query-form">
        <div class="choice-field">
          <span class="choice-label">店铺名</span>
          <input type="hidden" id="queryShopId" value="" />
          <div id="queryShopPicker" class="chip-grid" role="listbox" aria-label="筛选店铺"></div>
        </div>
        <label class="date-field-label">
          日期
          <div class="date-field">
            <input
              type="text"
              id="queryDate"
              placeholder="点日历选择，或输入 2026-08-06 / 2026-08 / 08-01~08-31"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="queryDateCalBtn" class="date-cal-btn" aria-label="打开日历" title="日历选择">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div id="queryCal" class="cal-pop" hidden>
            <div class="cal-modes" role="tablist">
              <button type="button" class="cal-mode active" data-mode="day">单日</button>
              <button type="button" class="cal-mode" data-mode="range">时段</button>
              <button type="button" class="cal-mode" data-mode="month">月份</button>
            </div>
            <div class="cal-nav">
              <button type="button" id="calPrev" aria-label="上一段">‹</button>
              <span id="calTitle" class="cal-title"></span>
              <button type="button" id="calNext" aria-label="下一段">›</button>
            </div>
            <div id="calHint" class="cal-hint">选择一天</div>
            <div id="calBody" class="cal-body"></div>
            <div class="cal-footer">
              <button type="button" id="calToday" class="btn-secondary">今天</button>
              <button type="button" id="calClear" class="btn-secondary">清空</button>
            </div>
          </div>
        </label>
        <div class="choice-field">
          <span class="choice-label">供应商名</span>
          <input type="hidden" id="querySupplierId" value="" />
          <div id="querySupplierPicker" class="chip-grid" role="listbox" aria-label="筛选供应商"></div>
        </div>
        <div class="query-actions">
          <button type="submit" id="queryBtn">查询</button>
          <button type="button" id="resetQueryBtn" class="btn-secondary">重置</button>
        </div>
      </form>
      <p id="queryMsg" class="msg" hidden></p>

      <div class="orders-readable query-results">
        <div class="list-head">
          <h3>查询结果</h3>
          <span id="listMeta" class="meta"></span>
        </div>
        <p id="sumMeta" class="sum-meta" hidden></p>
        <div id="resultTableWrap" class="result-table-wrap" hidden>
          <table class="result-table" id="resultTable">
            <thead>
              <tr>
                <th>订单编号</th>
                <th>店铺</th>
                <th>日期</th>
                <th>供应商</th>
                <th class="num">金额</th>
                <th class="ops">操作</th>
              </tr>
            </thead>
            <tbody id="orderList"></tbody>
          </table>
        </div>
        <p id="emptyHint" class="empty">暂无订单，请调整条件后查询</p>
      </div>
    </section>

    <section id="panelManage" class="panel tab-panel" role="tabpanel" hidden>
      <h2>店铺管理</h2>
      <form id="shopForm" class="inline-form">
        <input type="text" id="newShopName" placeholder="店铺名称" maxlength="200" required />
        <button type="submit">添加店铺</button>
      </form>
      <p id="shopMsg" class="msg" hidden></p>
      <div id="shopManageList" class="chip-grid manage-grid shop-manage-list" aria-label="店铺列表"></div>

      <h2 class="section-gap">供应商管理</h2>
      <form id="supplierForm" class="inline-form">
        <input type="text" id="newSupplierName" placeholder="供应商名称" maxlength="200" required />
        <button type="submit">添加供应商</button>
      </form>
      <p id="supplierMsg" class="msg" hidden></p>
      <div id="supplierManageList" class="chip-grid manage-grid shop-manage-list" aria-label="供应商列表"></div>

      <div class="recent-block orders-readable deletion-block">
        <div class="list-head">
          <h3>最近删除</h3>
          <div class="list-head-actions">
            <span id="deletionMeta" class="meta"></span>
            <button type="button" id="clearDeletionsBtn" class="btn-secondary clear-deletions-btn" hidden>清空</button>
          </div>
        </div>
        <div id="deletionTableWrap" class="result-table-wrap" hidden>
          <table class="result-table" id="deletionTable">
            <thead>
              <tr>
                <th>时间</th>
                <th>类型</th>
                <th>操作人</th>
                <th>内容</th>
              </tr>
            </thead>
            <tbody id="deletionList"></tbody>
          </table>
        </div>
        <p id="deletionEmpty" class="empty">暂无删除记录</p>
      </div>
    </section>
  </main>

  <div id="dupModal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dupTitle">
      <h3 id="dupTitle">是否提交</h3>
      <p id="dupText">订单信息可能重复，是否继续提交</p>
      <label id="dupNameWrap" class="modal-password" hidden>
        名称
        <input
          type="text"
          id="dupName"
          name="rename_value"
          maxlength="200"
          autocomplete="off"
          spellcheck="false"
          placeholder="请输入新名称"
        />
      </label>
      <label id="dupPasswordWrap" class="modal-password" hidden>
        登录密码
        <input
          type="password"
          id="dupPassword"
          name="admin_confirm"
          autocomplete="current-password"
          spellcheck="false"
          placeholder="请输入登录密码"
        />
      </label>
      <p id="dupPasswordError" class="msg err modal-password-error" hidden></p>
      <div class="modal-actions">
        <button type="button" id="dupYes">是</button>
        <button type="button" id="dupNo" class="btn-secondary">否</button>
      </div>
    </div>
  </div>

  <div id="passwordModal" class="modal" hidden>
    <div class="modal-backdrop" id="passwordBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
      <h3 id="passwordTitle">修改登录密码</h3>
      <form id="passwordForm" class="password-form">
        <label>
          当前密码
          <input type="password" id="oldPassword" autocomplete="current-password" required />
        </label>
        <label>
          新密码
          <input type="password" id="newPassword" autocomplete="new-password" minlength="4" maxlength="128" required />
        </label>
        <label>
          确认新密码
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="4" maxlength="128" required />
        </label>
        <p id="passwordMsg" class="msg" hidden></p>
        <div class="modal-actions">
          <button type="submit" id="passwordSave">保存</button>
          <button type="button" id="passwordCancel" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="editOrderModal" class="modal" hidden>
    <div class="modal-backdrop" id="editOrderBackdrop"></div>
    <div class="modal-card edit-order-card" role="dialog" aria-modal="true" aria-labelledby="editOrderTitle">
      <h3 id="editOrderTitle">修改订单</h3>
      <p id="editOrderMeta" class="edit-order-meta"></p>
      <form id="editOrderForm" class="edit-order-form">
        <div class="choice-field">
          <span class="choice-label">店铺名</span>
          <input type="hidden" id="editShopId" value="" />
          <div id="editShopPicker" class="chip-grid" role="listbox" aria-label="选择店铺"></div>
        </div>
        <label>
          日期
          <input type="date" id="editOrderDate" required />
        </label>
        <div class="choice-field">
          <span class="choice-label">供应商名</span>
          <input type="hidden" id="editSupplierId" value="" />
          <div id="editSupplierPicker" class="chip-grid" role="listbox" aria-label="选择供应商"></div>
        </div>
        <label>
          单日总金额
          <input type="number" id="editDailyTotal" min="0.01" step="0.01" required />
        </label>
        <p id="editOrderMsg" class="msg" hidden></p>
        <div class="modal-actions">
          <button type="submit" id="editOrderSave">保存</button>
          <button type="button" id="editOrderCancel" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js?v=20260810t"></script>
</body>
</html>
