[program:caraxes]
directory=/root/caraxes/server
command=/root/caraxes/server/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
user=root
environment=MONGODB_URI="mongodb://127.0.0.1:27017",MONGODB_DB="caraxes"
stdout_logfile=/var/log/supervisor/caraxes.out.log
stderr_logfile=/var/log/supervisor/caraxes.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_backups=5
